<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar Berhitung — Cerdas Anak Indonesia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layar">
    <h1>🌟 Belajar Berhitung 🌟</h1>
    <p class="salam">Halo, Sayang! Ayo Belajar Bersama 😊</p>

    <div class="kotak-soal">
      <p id="soal-angka" class="soal"></p>
      <p id="gambar-benda" class="gambar-benda"></p>
      
      <div class="jawaban">
        <button class="tombol-jawaban" data-nomor="1">1</button>
        <button class="tombol-jawaban" data-nomor="2">2</button>
        <button class="tombol-jawaban" data-nomor="3">3</button>
        <button class="tombol-jawaban" data-nomor="4">4</button>
        <button class="tombol-jawaban" data-nomor="5">5</button>
      </div>
    </div>

    <p id="pesan" class="pesan"></p>
    <button id="tombol-lanjut" class="tombol-lanjut">Lanjut ➡️</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
