<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar Berhitung — Cerdas Anak Indonesia</title>
  <link rel="icon" href="data:,">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Berhitung">
  <meta name="theme-color" content="#FFC107">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
    body{background:linear-gradient(135deg,#FFF8E1,#FFF3E0);min-height:100vh;padding:20px}
    .wadah{max-width:480px;margin:0 auto}
    .judul-utama{text-align:center;color:#5D4037;font-size:26px;margin:20px 0 30px}
    .grid-menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .kotak-menu{background:white;border-radius:20px;padding:24px 16px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);border-top:5px solid;transition:transform .2s}
    .kotak-menu:nth-child(1){border-color:#FFC107}
    .kotak-menu:nth-child(2){border-color:#4CAF50}
    .kotak-menu:nth-child(3){border-color:#2196F3}
    .kotak-menu:nth-child(4){border-color:#9C27B0}
    .kotak-menu:nth-child(5){border-color:#FF5722}
    .kotak-menu:nth-child(6){border-color:#00BCD4}
    .kotak-menu:active{transform:scale(.97)}
    .ikon-besar{font-size:40px;margin-bottom:10px}
    .kotak-menu h2{font-size:18px;color:#333;margin-bottom:6px}
    .kotak-menu p{font-size:13px;color:#757575;margin-bottom:12px}
    .bintang-poin{font-size:14px;font-weight:bold;color:#FF8F00}
  </style>
</head>
<body>

<div class="wadah">
  <h1 class="judul-utama">Mau Belajar Apa? 🎈</h1>
  <div class="grid-menu">

    <div class="kotak-menu" onclick="bukaMenu('hitung')">
      <div class="ikon-besar">🔢</div>
      <h2>Hitung Jumlah</h2>
      <p>Hitung benda & pilih angka</p>
      <div class="bintang-poin">⭐ <span id="poin-hitung">0</span></div>
    </div>

    <div class="kotak-menu" onclick="bukaMenu('tambah')">
      <div class="ikon-besar">➕</div>
      <h2>Penjumlahan</h2>
      <p>Jumlahkan angka sederhana</p>
      <div class="bintang-poin">⭐ <span id="poin-tambah">0</span></div>
    </div>

    <div class="kotak-menu" onclick="bukaMenu('kurang')">
      <div class="ikon-besar">➖</div>
      <h2>Pengurangan</h2>
      <p>Kurangkan angka sederhana</p>
      <div class="bintang-poin">⭐ <span id="poin-kurang">0</span></div>
    </div>

    <div class="kotak-menu" onclick="bukaMenu('angka')">
      <div class="ikon-besar">🔟</div>
      <h2>Kenal Angka</h2>
      <p>Angka 1 sampai 10</p>
      <div class="bintang-poin">⭐ <span id="poin-angka">0</span></div>
    </div>

    <div class="kotak-menu" onclick="bukaMenu('kali')">
      <div class="ikon-besar">✖️</div>
      <h2>Perkalian</h2>
      <p>Lipatkan angka</p>
      <div class="bintang-poin">⭐ <span id="poin-kali">0</span></div>
    </div>

    <div class="kotak-menu" onclick="bukaMenu('bagi')">
      <div class="ikon-besar">➗</div>
      <h2>Pembagian</h2>
      <p>Bagikan sama rata</p>
      <div class="bintang-poin">⭐ <span id="poin-bagi">0</span></div>
    </div>

  </div>
</div>

<script>
let poin = {
  hitung: parseInt(localStorage.getItem('poinHitung')||0),
  tambah: parseInt(localStorage.getItem('poinTambah')||0),
  kurang: parseInt(localStorage.getItem('poinKurang')||0),
  angka: parseInt(localStorage.getItem('poinAngka')||0),
  kali: parseInt(localStorage.getItem('poinKali')||0),
  bagi: parseInt(localStorage.getItem('poinBagi')||0)
};

document.getElementById('poin-hitung').textContent = poin.hitung;
document.getElementById('poin-tambah').textContent = poin.tambah;
document.getElementById('poin-kurang').textContent = poin.kurang;
document.getElementById('poin-angka').textContent = poin.angka;
document.getElementById('poin-kali').textContent = poin.kali;
document.getElementById('poin-bagi').textContent = poin.bagi;

function bukaMenu(nama){
  if(nama==='hitung'){
    alert('Siap! 🎉 Bagian Hitung Jumlah akan kita isi selanjutnya!');
  }else{
    alert(nama==='kali'?'Perkalian':'Pembagian'==nama?'Pembagian':nama==='tambah'?'Penjumlahan':nama==='kurang'?'Pengurangan':'Kenal Angka' + ' sedang disiapkan ya 🚧');
  }
}
</script>

</body>
</html>
