<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerdas Anak Hebat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
    body{background:linear-gradient(to bottom,#87CEFA,#B0E0E6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
    .video-wrapper{position:relative;width:100%;max-width:420px;border-radius:20px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.15);margin-bottom:30px;}
    .video-wrapper video{width:100%;display:block;}
    .watermark-cover{position:absolute;bottom:0;left:0;width:100%;height:16%;background:linear-gradient(to top,#87CEFA,rgba(135,206,250,.9),transparent);display:flex;align-items:center;justify-content:center;padding-bottom:5px;}
    .nama-aplikasi{color:#FF6B00;font-size:22px;font-weight:bold;text-shadow:1px 1px 2px rgba(255,255,255,.8);text-align:center;line-height:1.3;}
    .tombol-mulai{background:linear-gradient(to bottom,#FFD700,#FFA500);color:#fff;font-size:24px;font-weight:bold;border:none;border-radius:50px;padding:18px 60px;cursor:pointer;box-shadow:0 6px 0 #CC8400,0 8px 15px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s;}
    .tombol-mulai:active{transform:translateY(4px);box-shadow:0 2px 0 #CC8400;}
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video autoplay loop muted playsinline>
      <source src="intro-hewan.mp4" type="video/mp4">
      Maaf, browser tidak mendukung video.
    </video>
    <div class="watermark-cover">
      <div class="nama-aplikasi">CERDAS<br>ANAK HEBAT</div>
    </div>
  </div>
  <button class="tombol-mulai" onclick="alert('Siap belajar! 🎉')">🚀 MULAI BELAJAR</button>
</body>
</html>
