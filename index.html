<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerdas Anak Hebat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; overflow: hidden; }

    .video-penuh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    .video-penuh video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tombol-tengah {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .tombol-mulai {
      background: linear-gradient(to bottom, #FFD700, #FFA500);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      padding: 18px 60px;
      cursor: pointer;
      box-shadow: 0 6px 0 #CC8400;
    }
    .tombol-mulai:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #CC8400; }
  </style>
</head>
<body>

  <div class="video-penuh">
    <video autoplay loop muted playsinline>
      <source src="intro-hewan.mp4" type="video/mp4">
    </video>
  </div>

  <div class="tombol-tengah">
    <button class="tombol-mulai" onclick="alert('Siap Belajar! 🎉')">MULAI BELAJAR</button>
  </div>
<script>
  const vid = document.querySelector('.video-penuh video');
  vid.addEventListener('timeupdate', function() {
    if (vid.currentTime > vid.duration - 0.2) {
      vid.currentTime = 0;
    }
  });
</script>
</body>
</html>
