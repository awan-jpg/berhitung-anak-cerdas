<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerdas Anak Hebat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body {
      background: linear-gradient(to bottom, #87CEFA, #B0E0E6);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      margin-bottom: 30px;
    }
    .video-wrapper video { width: 100%; display: block; }
    .nama-aplikasi {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFD700;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .hewan-icon {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .hewan-icon span { font-size: 50px; }
    .tombol-mulai {
      background: linear-gradient(to bottom, #FFD700, #FFA500);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      padding: 18px 60px;
      cursor: pointer;
      box-shadow: 0 6px 0 #CC8400, 0 8px 15px rgba(0,0,0,0.2);
    }
    .tombol-mulai:active { transform: translateY(4px); box-shadow: 0 2px 0 #CC8400; }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video autoplay loop muted playsinline>
      <source src="intro-hewan.mp4" type="video/mp4">
    </video>
    <div class="nama-aplikasi">CERDAS ANAK HEBAT</div>
  </div>

  <div class="hewan-icon">
    <span>🐱</span>
    <span>🐰</span>
    <span>🦁</span>
    <span>🐻</span>
  </div>

  <button class="tombol-mulai" onclick="alert('Siap Belajar! 🎉')">MULAI BELAJAR</button>
</body>
</html>
